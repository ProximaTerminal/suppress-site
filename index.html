<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="description" content="Suppress is the marketplace for private intelligence. Coming soon.">
  <meta property="og:title" content="Suppress — Coming soon">
  <meta property="og:description" content="The marketplace for private intelligence, connecting knowledge to those who seek it.">
  <meta property="og:type" content="website">
  <title>Suppress — Coming soon</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f3ef;
      --ink: #101010;
      --muted: #62625d;
      --line: rgba(16, 16, 16, .2);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 18% 6%, rgba(255,255,255,.88), transparent 31rem),
        var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(100%, 1600px);
      margin: 0 auto;
      padding: 34px 42px 30px;
    }

    .header,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .header {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--ink);
    }

    .wordmark {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .x-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      font-size: 12px;
      letter-spacing: .14em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .x-link::after {
      content: "↗";
      font-size: 15px;
      transition: transform .2s ease;
    }

    .x-link:hover::after,
    .x-link:focus-visible::after { transform: translate(2px, -2px); }

    .x-link:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 6px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(300px, .72fr);
      align-items: end;
      gap: clamp(48px, 9vw, 160px);
      padding: clamp(86px, 14vh, 170px) 0 clamp(72px, 12vh, 140px);
    }

    .eyebrow {
      margin: 0 0 28px;
      font-size: 11px;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 1000px;
      margin: 0;
      font-size: clamp(78px, 12vw, 190px);
      font-weight: 400;
      letter-spacing: -.075em;
      line-height: .82;
    }

    .period { color: #77776f; }

    .about {
      align-self: end;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .about-label {
      display: block;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .about p {
      margin: 0;
      font-size: clamp(20px, 2vw, 31px);
      letter-spacing: -.03em;
      line-height: 1.18;
    }

    .footer {
      padding-top: 20px;
      border-top: 1px solid var(--ink);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .status { display: flex; align-items: center; gap: 9px; }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      animation: breathe 2.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: .25; }
      50% { opacity: 1; }
    }

    @media (max-width: 780px) {
      .page { padding: 24px 20px 22px; }
      .header { padding-bottom: 18px; }
      .wordmark { font-size: 14px; }
      .x-link { font-size: 10px; }
      main {
        grid-template-columns: 1fr;
        align-content: center;
        gap: 64px;
        padding: 72px 0;
      }
      h1 {
        font-size: clamp(72px, 23vw, 126px);
        line-height: .86;
      }
      .about { max-width: 470px; }
      .footer { align-items: flex-end; }
      .footer > span:last-child { max-width: 140px; text-align: right; line-height: 1.4; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 1; }
      .x-link::after { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <p class="wordmark">Suppress</p>
      <a class="x-link" href="https://x.com/UseSuppress" target="_blank" rel="noopener noreferrer" aria-label="Follow Suppress on X">X / UseSuppress</a>
    </header>

    <main>
      <section aria-labelledby="coming-soon">
        <p class="eyebrow">Private intelligence marketplace</p>
        <h1 id="coming-soon">Coming<br>soon<span class="period">.</span></h1>
      </section>

      <aside class="about" aria-label="About Suppress">
        <span class="about-label">What we are</span>
        <p>The marketplace for private intelligence, connecting knowledge to those who seek it.</p>
      </aside>
    </main>

    <footer class="footer">
      <span class="status"><span class="dot" aria-hidden="true"></span>In development</span>
      <span>Private knowledge. Paid answers.</span>
    </footer>
  </div>
</body>
</html>
